name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install ffmpeg
        # An independent reference for the true-peak meter, the decoder behind
        # fetch-corpus, and the MP3 encoder for the listening page. Every test
        # that needs it skips itself when it is absent.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg;
          else brew install ffmpeg; fi

      - name: Install
        # --locked: the numeric stack (numpy, scipy, librosa, pedalboard) can
        # shift output across releases, and a results table is only
        # reproducible against the versions that produced it.
        run: uv sync --locked --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Tests
        # A fork pull request gets no secret, so the whole suite has to pass
        # with the key explicitly empty. That is what the cassette layer and
        # the import contract above are for: the agent's routing, tool layer,
        # briefing filter and memory are all covered here, and the one module
        # that can reach the API is exercised from recorded transcripts.
        run: uv run pytest -q
        env:
          ANTHROPIC_API_KEY: ""
          HEADROOM_CASSETTE_MODE: replay

      - name: Demo runs on a fresh clone with no credential
        # The claim the README makes, asserted rather than asserted-in-prose.
        run: |
          uv run headroom synth-corpus --out audio/synthetic --seconds 12
          uv run headroom master audio/synthetic/synth_01.wav /tmp/out.wav \
            --target spotify --system agent-scaffold --budget 6
        env:
          ANTHROPIC_API_KEY: ""
